<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Lite Connect — message Lite directly.">
  <title>Chat with Lite — Connect</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="chat-page">
  <header class="nav chat-nav">
    <a class="brand" href="./">Connect<span>.</span></a>
    <a class="back" href="./">← Home</a>
  </header>

  <main class="chat-shell">
    <section class="chat-card">
      <div class="chat-header">
        <div class="avatar">L</div>
        <div>
          <p class="eyebrow">DIRECT CHAT</p>
          <h1>Talk with Lite</h1>
          <p id="status">Connecting…</p>
        </div>
      </div>

      <div id="messages" class="messages" aria-live="polite">
        <div class="empty-state">Loading your conversation…</div>
      </div>

      <form id="message-form" class="message-form">
        <textarea id="message-input" maxlength="1000" rows="1" placeholder="Write a message to Lite…" required></textarea>
        <button class="button primary" type="submit">Send</button>
      </form>
      <p class="chat-note">Please keep messages respectful. Never share passwords or other private information.</p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    );
  </script>
  <script src="js/chat.js"></script>
</body>
</html>
