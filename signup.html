<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Create Account — Connect</title><link rel="stylesheet" href="css/style.css"></head>
<body class="auth-page"><main class="auth-card"><a class="brand" href="./">Connect<span>.</span></a><h1>Create your account</h1><p class="auth-subtitle">Join Connect and start chatting.</p><form data-mode="signup"><label>Username<input name="username" type="text" placeholder="Your username" minlength="3" required></label><label>Email<input type="email" placeholder="you@example.com" required></label><label>Password<input type="password" placeholder="At least 8 characters" minlength="8" required></label><button class="button primary" type="submit">Create Account</button></form><p id="auth-message" class="auth-message"></p><p class="switch">Already have an account? <a href="login.html">Sign in</a></p><a class="back" href="./">← Back to home</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script src="js/auth.js"></script></body></html>
